[project]
name = "aie-hackathon-project"
version = "0.1.0"
description = "Self-improving coding swarm: a long task completed subtask by subtask, with reasoning-path reflection, versioned lessons and a held-out gate."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pymongo>=4.8",
    "hypothesis>=6.100",
    "pytest>=8.2",
    "openai>=1.40",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
local-embeddings = ["sentence-transformers>=3.0"]
viz = ["umap-learn>=0.5"]
dev = ["ruff>=0.5", "pytest-asyncio>=0.23"]

[project.scripts]
swarm = "core.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "eval*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
